<app-sidebar-item tabindex="0">
  <app-discord-logo />
</app-sidebar-item>

@if (servers$ | async; as servers) {
  @for (server of servers; track server.id) {
    <app-sidebar-item
      [title]="server.name"
      tabindex="0"
    />
  }
}

<app-sidebar-item tabindex="0">
  <app-circle-plus-icon />
</app-sidebar-item>
