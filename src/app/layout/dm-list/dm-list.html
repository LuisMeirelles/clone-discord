<header>
  <button>Encontre ou comece uma conversa</button>
</header>

<main>
  <ul>
    <li>
      <a href="">
        <app-avatar-waving-icon />
        Amigos
      </a>
    </li>
    <li>
      <a href="">
        <app-turbine-icon />
        Nitro
      </a>
    </li>
    <li>
      <a href="">
        <app-store-icon />
        Loja
      </a>
    </li>
    <li>
      <a href="">
        <app-laurels-icon />
        Missões
      </a>
    </li>
  </ul>

  <div class="dm">
    <div class="direct-messages">
      <span>Mensagens diretas</span>
      <div class="action-buttons">
        <app-ellipsis-icon [size]="16" />
        <app-plus-icon [size]="16" />
      </div>
    </div>

    <ul>
      @if (chats$ | async; as chats) {
        @for (chat of chats; track chat.id) {
          <li>
            <a href="">
              <app-discord-logo />
              {{ chat.username }}
            </a>
          </li>
        }
      }
    </ul>
  </div>
</main>
